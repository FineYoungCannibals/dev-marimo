# ---------- Development compose file ----------
services:
  marimo:
    build: .
    image: marimo-docker:dev
    restart: unless-stopped
    ports:
      - "${MARIMO_PORT:-2718}:2718"
    volumes:
      - ./notebooks:/home/app_user/app/notebooks
      - ./.marimo.toml:/home/app_user/.marimo.toml
    env_file:
      - .env
    command: bash -c 'source /home/app_user/venv/bin/activate && marimo edit --no-token --headless -p ${MARIMO_PORT:-2718} --host ${MARIMO_HOST:-0.0.0.0}'
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:2718/health" ]
      interval: 30s
      timeout: 3s
      retries: 3
